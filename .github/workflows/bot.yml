name: PriceGuessPro

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      OWNER_USER_ID: ${{ secrets.OWNER_USER_ID }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade Pip
        run: |
          python -m pip install --upgrade pip

      - name: Install Requirements
        run: |
          pip install -r requirements.txt

      - name: Create Folders
        run: |
          mkdir -p logs
          mkdir -p data

      - name: Create Database If Missing
        run: |
          touch price_guess.db

      - name: Run Bot
        run: |
          python bot.py

      - name: Restart Protection
        if: failure()
        run: |
          echo "Bot crashed. GitHub Actions will restart on next schedule cycle."
