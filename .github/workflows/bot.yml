name: COLORS_SOK_2B

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

jobs:
  bot:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # =====================================================
      # تحميل ملفات المشروع
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =====================================================
      # تشغيل Python 3.11
      # =====================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"


      # =====================================================
      # تحديث pip
      # =====================================================

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip


      # =====================================================
      # تثبيت Discord.py
      # =====================================================

      - name: Install dependencies
        run: |
          python -m pip install -U "discord.py==2.7.1"


      # =====================================================
      # التحقق من Python و Discord.py
      # =====================================================

      - name: Check Python
        run: |
          python --version
          python -c "import discord; print('discord.py:', discord.__version__)"


      # =====================================================
      # التحقق من وجود ملفات البوت
      # =====================================================

      - name: Check bot files
        run: |
          echo "Checking COLORS_SOK_2B files..."

          if [ ! -f "COLORS_SOK_2B/bot.py" ]; then
            echo "ERROR: bot.py not found!"
            exit 1
          fi

          echo "bot.py found."

          if [ -f "COLORS_SOK_2B/colors.png" ]; then
            echo "colors.png found."
          else
            echo "WARNING: colors.png not found."
            echo "The /colors command will not be able to send the image."
          fi


      # =====================================================
      # تشغيل البوت
      # =====================================================

      - name: Run Discord Bot
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -u COLORS_SOK_2B/bot.py
