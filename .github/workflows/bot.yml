name: Discord Music Bot

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  music-bot:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # تحميل ملفات المستودع
      # ==========================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==========================================
      # Python
      # ==========================================

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"


      # ==========================================
      # تحديث Ubuntu
      # ==========================================

      - name: Update System
        run: |
          sudo apt-get update


      # ==========================================
      # تثبيت FFmpeg
      # ==========================================

      - name: Install FFmpeg
        run: |
          sudo apt-get install -y ffmpeg


      # ==========================================
      # التحقق من FFmpeg
      # ==========================================

      - name: Check FFmpeg
        run: |
          ffmpeg -version


      # ==========================================
      # تحديث pip
      # ==========================================

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel


      # ==========================================
      # تثبيت Discord
      # ==========================================

      - name: Install Discord Voice
        run: |
          python -m pip install -U "discord.py[voice]"


      # ==========================================
      # مكتبة davey
      # ضرورية لاتصال Discord Voice
      # ==========================================

      - name: Install Davey
        run: |
          python -m pip install -U davey


      # ==========================================
      # PyNaCl
      # تشفير اتصال Discord الصوتي
      # ==========================================

      - name: Install PyNaCl
        run: |
          python -m pip install -U PyNaCl


      # ==========================================
      # yt-dlp
      # البحث واستخراج الصوت
      # ==========================================

      - name: Install yt-dlp
        run: |
          python -m pip install -U yt-dlp


      # ==========================================
      # التحقق من المكتبات
      # ==========================================

      - name: Check Python Libraries
        run: |
          python -c "import discord; print('discord.py:', discord.__version__)"
          python -c "import davey; print('davey: OK')"
          python -c "import nacl; print('PyNaCl: OK')"
          python -c "import yt_dlp; print('yt-dlp:', yt_dlp.version.__version__)"


      # ==========================================
      # تشغيل البوت
      # ==========================================

      - name: Start Discord Music Bot
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}

        run: |
          python bot.py
