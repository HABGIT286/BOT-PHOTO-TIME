name: Discord Music Bot

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:

  music-bot:

    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # Checkout
      # ==================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==================================================
      # Python 3.11
      # ==================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"


      # ==================================================
      # System update
      # ==================================================

      - name: Update System
        run: |
          sudo apt-get update


      # ==================================================
      # FFmpeg
      # ==================================================

      - name: Install FFmpeg
        run: |
          sudo apt-get install -y ffmpeg


      # ==================================================
      # Check FFmpeg
      # ==================================================

      - name: Check FFmpeg
        run: |
          ffmpeg -version


      # ==================================================
      # Upgrade pip
      # ==================================================

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel


      # ==================================================
      # Discord.py Voice
      # ==================================================

      - name: Install Discord.py
        run: |
          python -m pip install -U "discord.py[voice]"


      # ==================================================
      # Davey
      # ==================================================

      - name: Install Davey
        run: |
          python -m pip install -U davey


      # ==================================================
      # PyNaCl
      # ==================================================

      - name: Install PyNaCl
        run: |
          python -m pip install -U PyNaCl


      # ==================================================
      # yt-dlp
      # ==================================================

      - name: Install yt-dlp
        run: |
          python -m pip install -U --pre yt-dlp


      # ==================================================
      # Verify Python libraries
      # ==================================================

      - name: Verify Libraries
        run: |
          python -c "import discord; print('discord.py:', discord.__version__)"
          python -c "import davey; print('davey: OK')"
          python -c "import nacl; print('PyNaCl: OK')"
          python -c "import yt_dlp; print('yt-dlp:', yt_dlp.version.__version__)"


      # ==================================================
      # Verify bot.py
      # ==================================================

      - name: Check bot.py
        run: |
          test -f bot.py
          python -m py_compile bot.py


      # ==================================================
      # Start Bot
      # ==================================================

      - name: Start Discord Music Bot
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}

        run: |
          python bot.py
